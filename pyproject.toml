[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlnet"
version = "0.15.0"
description = "Framework tu dong thiet ke mang deep learning tu du lieu, dong goi baseline PyTorch"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml"]
design = ["numpy", "pandas", "scipy", "scikit-learn", "torch"]

[project.scripts]
dlnet = "dlnet.cli:main"

[tool.setuptools.packages.find]
include = ["dlnet*"]

[tool.setuptools.package-data]
dlnet = ["data/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ref"]  # third-party reference code, kept verbatim

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "regression: pins behaviours found in audits; must always pass",
    "e2e: runs the CLI and the exported package in subprocesses (slower)",
]

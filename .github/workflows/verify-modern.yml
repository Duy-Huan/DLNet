name: Verify ported blocks against official code

# Numerical equivalence of dlnet/zoo/ops_modern.py (TabM, PLR, PatchTST, iTransformer) with the
# authors' code: scripts/verify_modern.py. The official code is pinned (PyPI versions, git commits)
# and only installed on this runner; it is not a dependency of DLNet.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - dlnet/zoo/ops_modern.py
      - dlnet/zoo/ops_freq.py
      - dlnet/zoo/ops_next.py
      - scripts/verify_next.py
      - scripts/verify_modern.py
      - scripts/verify_freq.py
      - .github/workflows/verify-modern.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DLNet (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . numpy
      - name: Official code (pinned)
        run: |
          pip install --target /tmp/m --no-deps tabm==0.0.3 rtdl_num_embeddings==0.0.12
          git clone https://github.com/yuqinie98/PatchTST /tmp/PatchTST
          git -C /tmp/PatchTST checkout 204c21efe0b39603ad6e2ca640ef5896646ab1a9
          git clone https://github.com/thuml/iTransformer /tmp/iTransformer
          git -C /tmp/iTransformer checkout c2426e68ca13f74aaec08045c5c724d8ad328124
      - name: Compare outputs
        run: |
          PYTHONPATH=/tmp/m python scripts/verify_modern.py \
            --patchtst /tmp/PatchTST --itransformer /tmp/iTransformer

  verify-freq:
    # frequency-domain blocks (dlnet/zoo/ops_freq.py): GFNet, AFNO, FFC, FcaNet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DLNet (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . numpy
      - name: Official code (pinned)
        run: |
          set -e
          clone() { git clone -q "https://github.com/$1" "$2" && git -C "$2" checkout -q "$3"; }
          clone raoyongming/GFNet /tmp/GFNet 2de48b626ea805de82a7f389fed930af1ae0340d
          clone NVlabs/AFNO-transformer /tmp/AFNO 941e924ffdb34cb93897b5fd6e22e5965fdc1111
          clone pkumivision/FFC /tmp/FFC 39dcc992c373b0705f64d0204c4c04669381b8ea
          clone cfzd/FcaNet /tmp/FcaNet aa5fb63505575bb4e4e094613565379c3f6ada33
      - name: Compare outputs
        run: |
          python scripts/verify_freq.py --gfnet /tmp/GFNet --afno /tmp/AFNO \
            --ffc /tmp/FFC --fcanet /tmp/FcaNet

  verify-next:
    # v1.0 drop-in operators (dlnet/zoo/ops_next.py)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DLNet (CPU torch) and the reference libraries
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . numpy "transformers==4.51.3" "timm==1.0.31" "PyWavelets==1.8.0"
      - name: Official code (pinned)
        run: |
          set -e
          mkdir -p /tmp/v1 && cd /tmp/v1
          clone() { git clone -q "https://github.com/$1" "$2" && git -C "$2" checkout -q "$3"; }
          clone jiachenzhu/DyT DyT aab5dde
          clone qiuzh20/gated_attention gated_attention f4c2a5f
          clone naver-ai/rope-vit rope-vit 48d8df5
          clone BGU-CS-VIL/WTConv WTConv 4a84da2
          clone jameslahm/lsnet lsnet cbe737c
          clone ma-xu/Rewrite-the-Stars Rewrite-the-Stars c999eb5
          clone mit-han-lab/efficientvit efficientvit de7d773
          clone Visual-Attention-Network/SegNeXt SegNeXt c87bcae
          git clone -q --filter=blob:none --sparse https://github.com/microsoft/unilm unilm
          git -C unilm sparse-checkout set Diff-Transformer && git -C unilm checkout -q 31c5b90
      - name: Compare outputs
        run: python scripts/verify_next.py --root /tmp/v1

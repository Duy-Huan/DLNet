name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  enforce-source:
    name: enforce-source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: PR vao main chi duoc den tu dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PR vao main phai den tu nhanh dev (hien tai: ${{ github.head_ref }})"
            exit 1
          fi

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

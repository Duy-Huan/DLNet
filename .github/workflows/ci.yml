name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"  # weekly: catches torch/scikit-learn upgrades breaking the pipeline

permissions:
  contents: read

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  enforce-source:
    name: enforce-source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: PR vao main chi duoc den tu dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PR vao main phai den tu nhanh dev (hien tai: ${{ github.head_ref }})"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch, so the torch tests really run)
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev,design]"
      - name: Unit + regression tests (e2e runs in its own job); fail if anything is skipped
        run: |
          pytest -q -m "not e2e" -rs -p no:cacheprovider | tee pytest.out
          if grep -q "^SKIPPED" pytest.out; then
            echo "::error::tests were skipped (missing dependency?)"; exit 1
          fi

  regression:
    name: regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev,design]"
      - name: Regression suite (pins every bug found in audits)
        run: pytest -q -m regression -p no:cacheprovider

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev,design]"
      - name: CLI -> exported package -> its own tests and train.py (tabular + HSI)
        run: pytest -q -m e2e -p no:cacheprovider

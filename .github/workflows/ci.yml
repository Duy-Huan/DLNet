name: CI

on:
  push:
    branches: [dev, main]
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"  # weekly: catches torch/scikit-learn upgrades breaking the pipeline

permissions:
  contents: read

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch, so the torch tests really run)
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev,design]"
      - name: Unit + regression tests (e2e runs in its own job); fail if anything is skipped
        run: |
          pytest -q -m "not e2e" -rs -p no:cacheprovider | tee pytest.out
          if grep -q "^SKIPPED" pytest.out; then
            echo "::error::tests were skipped (missing dependency?)"; exit 1
          fi

  regression:
    name: regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev,design]"
      - name: Regression suite (pins every bug found in audits)
        run: pytest -q -m regression -p no:cacheprovider

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev,design]"
      - name: CLI -> exported package -> its own tests and train.py (tabular + HSI)
        run: pytest -q -m e2e -p no:cacheprovider

  env-setup:
    name: env-setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup nhu nguoi dung (script cai .venv, co tu kiem tra)
        if: runner.os != 'Windows'
        run: ./scripts/setup_env.sh
      - name: Setup nhu nguoi dung (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup_env.ps1
      - name: Kich hoat .venv roi chay lenh (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          which dlnet
          dlnet --version
          dlnet selfcheck
      - name: Kich hoat .venv roi chay lenh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          (Get-Command dlnet).Source
          dlnet --version
          dlnet selfcheck

  env-requirements:
    name: env-requirements (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: venv va pip install -r requirements.txt (dung luong cua nguoi dung)
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/activate ]; then source .venv/bin/activate; else source .venv/Scripts/activate; fi
          python --version
          pip install -r requirements.txt
          python -m dlnet selfcheck
